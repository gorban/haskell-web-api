name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: web_api_dev
      DATABASE_USER: web_api_runtime
      DATABASE_PASSWORD: web_api
      WEB_API_MIGRATION_DATABASE_HOST: 127.0.0.1
      WEB_API_MIGRATION_DATABASE_PORT: 5432
      WEB_API_MIGRATION_DATABASE_NAME: web_api_dev
      WEB_API_MIGRATION_DATABASE_USER: web_api_owner
      WEB_API_MIGRATION_DATABASE_PASSWORD: web_api_owner
      OTLP_TRACING_ENDPOINT: http://127.0.0.1:4318/v1/traces
      SETUP_AUTOSTART_DATABASE: false
      SETUP_AUTOSTART_JAEGER: false
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: web_api_owner
          POSTGRES_PASSWORD: web_api_owner
          POSTGRES_DB: web_api_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=web_api_owner --dbname=web_api_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      jaeger:
        image: jaegertracing/all-in-one
        ports:
          - 4318:4318
          - 16686:16686

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Haskell
        if: steps.checkout.outcome == 'success'
        id: setup_haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.1.0'

      - name: Setup Node
        if: steps.setup_haskell.outcome == 'success'
        id: setup_node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/test-core/playwright-runner/package-lock.json

      - name: Install system tools
        if: steps.setup_node.outcome == 'success'
        id: dos2unix
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix postgresql-client

      - name: Install Playwright Chromium
        if: steps.dos2unix.outcome == 'success'
        id: playwright
        run: |
          npm ci --prefix packages/test-core/playwright-runner
          cd packages/test-core/playwright-runner
          npx playwright install chromium --with-deps

      - name: Wait for prerequisite services
        if: steps.playwright.outcome == 'success'
        id: prerequisite_services
        shell: bash
        run: |
          set -euo pipefail

          until pg_isready --host="$DATABASE_HOST" --port="$DATABASE_PORT" --username="$WEB_API_MIGRATION_DATABASE_USER" --dbname="$WEB_API_MIGRATION_DATABASE_NAME"; do
            sleep 1
          done

          until curl --fail --silent --show-error http://127.0.0.1:16686/ >/dev/null; do
            sleep 1
          done

          node --version

      - name: Restore Cabal cache
        if: steps.playwright.outcome == 'success'
        id: cabal_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cabal/bin
            ~/.cabal/store
          key: ${{ runner.os }}-ghc-9.14.1-cabal-${{ hashFiles('**/*.cabal', 'cabal.project') }}

      - name: Install test tools
        if: steps.cabal_cache.outcome == 'success' && steps.cabal_cache.outputs.cache-hit != 'true'
        id: install_test_tools
        run: |
          cabal update
          cabal install --ignore-project hspec-discover

      - name: Seed PostgreSQL test database
        if: steps.install_test_tools.outcome == 'success' || steps.install_test_tools.outcome == 'skipped'
        id: seed_postgres
        run: |
          cabal run haskell-web-api-db -- migrate-and-seed

      - name: Run tests with coverage
        if: steps.seed_postgres.outcome == 'success'
        id: coverage
        shell: bash
        run: |
          # Fail on first non-zero exit code, including intermediate piped commands
          set -euo pipefail

          # Exercise the coverage script's failure contract before spending the
          # full coverage run on a change that could silently weaken the gate.
          tools/test-generate-code-coverage.sh
          tools/test-check-build-diagnostics.sh

          # Capture coverage's exit code so the diagnostic classifier can inspect
          # the complete build output before either quality gate fails the job.
          coverage_exit=0
          coverage_log="$(mktemp)"
          set +e
          ./generate-code-coverage.sh 2>&1 | tee "$coverage_log"
          pipeline_status=("${PIPESTATUS[@]}")
          coverage_exit="${pipeline_status[0]}"
          tee_exit="${pipeline_status[1]}"
          set -e
          if [ "$tee_exit" != 0 ]; then
            coverage_exit="$tee_exit"
          fi
          diagnostic_exit=0
          tools/check-build-diagnostics.sh "$coverage_log" || diagnostic_exit=$?

          # Store exit code for later
          echo "exit_code=$coverage_exit" >> "$GITHUB_OUTPUT"
          echo "diagnostic_exit=$diagnostic_exit" >> "$GITHUB_OUTPUT"

          # Let the dedicated gates below report the coverage or diagnostic failure.

      - name: Check build diagnostics
        if: steps.coverage.outcome == 'success'
        id: check_build_diagnostics
        run: |
          exit "${{ steps.coverage.outputs.diagnostic_exit }}"

      - name: Check coverage result
        if: steps.check_build_diagnostics.outcome == 'success'
        id: check_coverage_result
        shell: bash
        run: |
          exit_code="${{ steps.coverage.outputs.exit_code }}"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Coverage script failed with exit code $exit_code"
            exit "$exit_code"
          fi

      - name: Prepare coverage report for GitHub Pages
        id: prepare_coverage_report
        if: github.ref == 'refs/heads/main' && steps.check_coverage_result.outcome == 'success'
        run: |
          set -euo pipefail

          # Create a directory structure for GitHub Pages
          mkdir -p _site

          # Copy the main coverage index
          cp hpc_index.html _site/index.html

          # Copy all HPC report directories from dist-newstyle
          # Structure: dist-newstyle/build/<arch>/ghc-<ver>/<pkg-ver>/opt/hpc/vanilla/html/
          # We need the entire html/ directory contents (hpc_index*.html + <pkg>-inplace/ subdir)
          find dist-newstyle -type d -path '*/hpc/vanilla/html' | while read -r html_dir; do
            # Extract package-version from path (e.g., "core-0.1.0.0" from ".../core-0.1.0.0/opt/hpc/...")
            pkg_ver=$(echo "$html_dir" | sed -n 's|.*/ghc-[^/]*/\([^/]*\)/opt/hpc/vanilla/html|\1|p')
            if [ -n "$pkg_ver" ]; then
              mkdir -p "_site/$pkg_ver"
              cp -r "$html_dir"/* "_site/$pkg_ver/"
            fi
          done

          # Fix iframe src paths in the index to use relative paths
          # From: dist-newstyle/build/x86_64-linux/ghc-9.14.1/core-0.1.0.0/opt/hpc/vanilla/html/hpc_index.html
          # To:   core-0.1.0.0/hpc_index.html
          sed -i "s|dist-newstyle/build/[^/]*/ghc-[^/]*/\([^/]*\)/opt/hpc/vanilla/html/|\1/|g" _site/index.html

          # Fix the file: URL check to work with https:// on GitHub Pages
          # The original checks for file:// URLs (for local viewing)
          # Replace with same-origin check for GitHub Pages (https://*.github.io/*)
          sed -i 's@if (!/^file:/i\.test(data\.href)) return;@if (new URL(data.href, window.location.href).origin !== window.location.origin) return;@g' _site/index.html

      - name: Setup Pages
        id: setup_pages
        if: github.ref == 'refs/heads/main' && steps.prepare_coverage_report.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload coverage artifact
        id: upload_coverage_artifact
        if: github.ref == 'refs/heads/main' && steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.upload_coverage_artifact.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install formatting and Ormolu test tools
        if: steps.check_coverage_result.outcome == 'success' && steps.cabal_cache.outputs.cache-hit != 'true'
        id: install_formatting_tools
        run: |
          .github/scripts/install-formatting-tools.sh

      - name: Formatting checks
        if: steps.check_coverage_result.outcome == 'success' && (steps.install_formatting_tools.outcome == 'success' || steps.install_formatting_tools.outcome == 'skipped')
        id: formatting_checks
        run: |
          .github/scripts/formatting-checks.sh

      - name: VS Code Ormolu formatter checks
        if: steps.formatting_checks.outcome == 'success'
        id: vscode_ormolu_formatter_checks
        run: |
          tools/check-vscode-ormolu-formatter.sh

      - name: Run integration and E2E tests
        if: steps.check_coverage_result.outcome == 'success'
        id: run_tests_skip_unit
        run: |
          cabal build all -O2 --ghc-options=-Werror
          cabal test all -O2 --test-options="--skip Unit"

      - name: Upload Playwright failure artifacts
        if: failure() && steps.run_tests_skip_unit.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failures
          path: '**/test-results/playwright/'
          if-no-files-found: ignore

      - name: Save Cabal cache
        if: |
          always() &&
          steps.cabal_cache.outputs.cache-hit != 'true' &&
          (
            success() ||
            steps.coverage.outcome == 'failure' ||
            steps.prepare_coverage_report.outcome == 'failure' ||
            steps.setup_pages.outcome == 'failure' ||
            steps.upload_coverage_artifact.outcome == 'failure' ||
            steps.deployment.outcome == 'failure' ||
            steps.formatting_checks.outcome == 'failure' ||
            steps.vscode_ormolu_formatter_checks.outcome == 'failure' ||
            steps.run_tests_skip_unit.outcome == 'failure' ||
            steps.check_coverage_result.outcome == 'failure'
          )
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cabal/bin
            ~/.cabal/store
          key: ${{ steps.cabal_cache.outputs.cache-primary-key }}
